auth:
  jwt:
    secret: ${JWT_SECRET}
spring:
  application:
    name: user-management-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
server:
  port: 8080
